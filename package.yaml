name: hq-pack-core-skills
version: 1.0.0
publisher: '@indigoai-us'
access: public
description: 'HQ core skills (/prd, /handoff, /checkpoint and the rest of the release-shipped set) as one required pack. hq-cli pins and installs it; each skill is linked under its unprefixed name at .claude/skills/<name>. The core-resident bootstrap skills in core-resident-skills.txt stay in hq-core.'
license: MIT
repository: https://github.com/indigoai-us/hq-pack-core-skills
# Link contributes.skills into .claude/skills/<name> with no pack prefix.
# Honored only for this first-party pack (hq-cloud reindex, US-006).
surface: unprefixed
requires:
  hqCore: '>=16.0.0'
  hqCli: '>=5.345.161'
contributes:
