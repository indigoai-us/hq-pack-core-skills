# Release: runs only when a v* tag is pushed. A push to main publishes nothing
# (indigo-hq-npm-publish-via-tag-not-main-push). See RELEASING.md.
#
# The npm trusted publisher for @indigoai-us/hq-pack-core-skills is bound to
# this file name (release.yml). Renaming it breaks OIDC publishing.
#
# What this workflow does not do: sign the pack or register the marketplace
# listing. hq-pro signs every listing server-side with mkt-sign-v1 when a
# verified creator runs `hq publish`, and staff approve it. Those steps, and
# `node scripts/verify-release.mjs <version>`, follow this run by hand.
#
# Steps are inline rather than indigoai-us/.github _npm-publish.yml: that
# workflow publishes in its own job and expects an install step, version
# stamping from the tag, and Sentry wiring, while this release needs the
# tarball build, the npm-content check, the GitHub release and the
# attestation poll on the same checkout as the publish.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # actions/checkout can store a pushed annotated tag as a lightweight ref.
      # Fetch the tag object itself so the annotated-tag check sees it.
      - name: Fetch the pushed tag object
        env:
          TAG: ${{ github.ref_name }}
        run: git fetch --force --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"

      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(bash scripts/check-release-tag.sh "$TAG")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing needs npm 11.5.1 or newer.
      - name: Use npm 11.5.1 or newer
        run: |
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"; then
            npm install -g npm@^11.5.1
          fi
          npm --version

      - name: Install hq-cli for the install tests
        run: bash scripts/install-test-hq-cli.sh "$RUNNER_TEMP/hq-cli" >> "$GITHUB_ENV"

      - name: npm run check
        run: npm run check

      - name: npm test
        run: npm test

      - name: Build the marketplace tarball
        id: tarball
        run: |
          path="$(bash scripts/build-tarball.sh --out "$RUNNER_TEMP/release")"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/release/SHA256SUMS"

      # npm pack drops .gitignore files; fail on any other difference.
      - name: Compare the npm package with the tarball
        env:
          TARBALL: ${{ steps.tarball.outputs.path }}
        run: node scripts/check-npm-contents.mjs --tarball "$TARBALL"

      # OIDC trusted publishing: no npm token. Provenance is attached from this
      # run's identity.
      - name: Publish to npm
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if [[ "$VERSION" == *-* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.tag.outputs.version }}
          TARBALL: ${{ steps.tarball.outputs.path }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" "$TARBALL" "$RUNNER_TEMP/release/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --notes-from-tag --title "$TAG" "${prerelease[@]}"

      # The marketplace listing is registered by a person after this run, so
      # only npm is checked here. Fails if the version or its attestations do
      # not show within 10 minutes.
      - name: Verify npm shows the version with attestations
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: node scripts/verify-release.mjs "$VERSION" --npm-only --npm-view --wait 600
