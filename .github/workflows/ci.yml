# One Linux job on pull requests, skipped for drafts
# (indigo-ci-local-first-minimal-github-actions). Run `npm run check` and
# `npm test` locally before marking a PR ready. No push, schedule, macOS or
# Windows jobs.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # No dependency install for the pack: the checks are bash plus the
      # runner's node. The install tests drive the oldest supported hq-cli,
      # installed from npm into a temp prefix.
      - name: Install hq-cli for the install tests
        run: bash scripts/install-test-hq-cli.sh "$RUNNER_TEMP/hq-cli" >> "$GITHUB_ENV"
      - name: npm run check
        run: npm run check
      - name: npm test
        run: npm test
